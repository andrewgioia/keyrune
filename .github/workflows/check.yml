name: Validate
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- less/icons.less less/glyphs.less css docs/assets/keyrune.min.css docs/fonts docs/icons.html docs/cheatsheet.html
      - run: npm pack --dry-run
